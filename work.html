<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- swiper js  -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <!-- swiper js  -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="shortcut icon" href="images/fav-icon.png" type="image/x-icon" />
    <title>Work</title>
  </head>
  <body>
    <!-- Header section Start -->
    <div class="header">
      <div class="container">
        <div class="header-main">
          <div class="row align-items-center">
            <div class="col-xl-6 col-md-6">
              <div class="logo">
                <a href="#"><img src="images/logo.svg" alt="" /></a>
              </div>
            </div>

            <div class="col-xl-6 col-md-6">
              <div class="manu">
                <ul>
                  <li><a href="#">Work</a></li>
                  <li><a href="#">Studio</a></li>
                  <li><a href="#">Contact</a></li>
                </ul>
              </div>
            </div>
          </div>
          <div class="mob-manu">
            <h3>Manu</h3>
          </div>
        </div>
      </div>
    </div>
    <!-- Header Sction End -->

    <!-- work shape Sction Start -->
    <div class="work-circle">
      <div class="work-circle-1"></div>
      <div class="work-circle-2"></div>
    </div>
    <!-- work shape Sction End -->

    <!-- work hero Sction Start -->
    <div class="work-hero">
      <div class="container">
        <div class="row">
          <div class="col-xl-12">
            <div class="work-hero-content">
              <h1>WORK</h1>
            </div>
          </div>
        </div>
        
    <div class="work-hero-tab">
        <ul class="nav nav-pills" id="pills-tab">
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home">All</button>
                <button class="nav-link" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home">Experiential</button>
                <button class="nav-link" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home">Environment</button>
                <button class="nav-link" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home">Digital</button>
            </li>
        </ul>
        <div class="work-tab-content" id="pills-tabContent">
        <div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab" tabindex="0">
            <div class="work-tab-one">
                <div class="work-tab-image-box-one">
                    <video src="images/work-tab-video-1.mp4" autoplay loop muted></video>
                </div>
                <div class="work-tab-content"></div>
            </div>
            <div class="work-tab-two">
                <div class="work-tab-image-box">
                    <img src="images/work-tab-image-10.jpg" alt="">
                </div>
                <div class="work-tab-content"></div>
            </div>
            <div class="work-tab-three">
                <div class="work-tab-image-box">
                    <img src="images/work-tab-image-10.jpg" alt="">
                </div>
                <div class="work-tab-content"></div>
            </div>
        </div>
        <div class="tab-pane fade" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab" tabindex="0">...</div>
        <div class="tab-pane fade" id="pills-contact" role="tabpanel" aria-labelledby="pills-contact-tab" tabindex="0">...</div>
        <div class="tab-pane fade" id="pills-disabled" role="tabpanel" aria-labelledby="pills-disabled-tab" tabindex="0">...</div>
        </div>
        </div>
      </div>
    </div>
    <!-- work hero Sction End -->

    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/function.js"></script>
  </body>
</html>
